<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />   <!-- 2026-10-17: 포트폴리오(비공개 · 검색 제외)에 올리는 데모라 검색엔진에 안 잡히게 -->
<title>Extraction B — 핫싯</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --glass: rgba(42, 51, 64, 0.46);
    --glass-strong: rgba(30, 36, 46, 0.78);
    --glass-line: rgba(255, 255, 255, 0.16);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.72);
    --accent: #E8973A;
    --paper: #F1E8D2;
    --ink: #3A3128;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c8cfae; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--text); }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hidden { display: none !important; }
  .glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 6px 24px rgba(30, 24, 50, 0.25); }
  button { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--glass-line); border-radius: 10px; padding: 6px 11px; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: rgba(232,151,58,0.42); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: rgba(232,151,58,0.6); }
  button.on { border-color: var(--accent); background: rgba(232,151,58,0.3); }
  button.big { font-size: 16px; padding: 10px 22px; font-weight: 700; }
  button.ghost { background: transparent; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); vertical-align: -1px; margin-right: 5px; }

  /* AI 좌석: 시작 화면 좌석 표 · 관전(읽기 전용) 표시 */
  .seat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 4px 0 6px; }
  .seat-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.07); }
  .seat-row b { width: 28px; }
  .seat-row select { flex: 1; }
  body.readonly-hud .hand-fan .card { cursor: default; }

  /* 상단 · 정보 */
  /* ---------- 위 상태 줄(F2d): 트랙 · 다른 플레이어 판 · 덱 더미 ---------- */
  #topbar { position: fixed; left: 0; right: 0; top: 0; height: 88px; display: flex; gap: 10px; align-items: stretch; padding: 8px 14px; z-index: 14; background: linear-gradient(rgba(18,20,28,.78), rgba(18,20,28,.45)); pointer-events: none; }
  #topbar > * { pointer-events: auto; }
  /* 2026-10-17: 상대 정보 판 사이 빈 공간이 아래 보드 클릭을 가로채지 않게 — 판만 클릭을 받음 */
  #topbar > #tb-plates { pointer-events: none; }
  #tb-plates > * { pointer-events: auto; }
  #hud { width: 230px; flex: none; padding: 6px 12px; }
  #hud .phase { font-size: 14px; font-weight: 800; }
  #hud .acts { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
  #tb-dots { font-size: 11px; color: var(--text-dim); display: flex; gap: 10px; margin-top: 3px; }
  #tb-dots i { display: inline-flex; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); align-items: center; justify-content: center; font-style: normal; font-size: 9px; margin-left: 2px; }
  #tb-dots i.on { background: var(--accent); border-color: #fff; color: #fff; }
  #tb-dots i.done { background: rgba(255,255,255,.35); }
  #tb-plates { flex: 1; min-width: 0; display: flex; gap: 8px; }
  .tb-plate { flex: 1; min-width: 0; max-width: 560px; position: relative; padding: 6px 10px 6px 14px; border-radius: 12px; background: rgba(30,36,46,.72); border: 2px solid transparent; cursor: pointer; }
  .tb-plate::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 5px; border-radius: 0 4px 4px 0; background: var(--team); }
  .tb-plate.cur { border-color: var(--team); box-shadow: 0 0 16px color-mix(in srgb, var(--team) 60%, transparent); background: color-mix(in srgb, var(--team) 22%, rgba(30,36,46,.82)); animation: curglow 1.6s ease-in-out infinite; }
  .tb-plate.cur .tb-who b::after { content: ' ▶ 차례'; color: #FFD27A; font-size: .8em; }
  @keyframes curglow { 0%, 100% { box-shadow: 0 0 10px color-mix(in srgb, var(--team) 45%, transparent); } 50% { box-shadow: 0 0 22px color-mix(in srgb, var(--team) 85%, transparent); } }
  .tb-plate:hover { background: rgba(50,58,72,.85); }
  .tb-plate:hover::after { content: '🏠 눌러서 쉘터 보기'; position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 700; color: #fff; background: #1E2230; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 2px 9px; pointer-events: none; z-index: 20; }
  .tb-who { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .tb-who small { color: var(--text-dim); font-size: 11px; }
  .tb-res { margin-left: auto; display: flex; gap: 10px; font-size: 12px; }
  .tb-res b { font-size: 13px; margin-left: 1px; }
  .tb-chars { display: flex; gap: 10px; margin-top: 4px; }
  .tb-chip { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .tb-chip.ex { opacity: .6; }
  .tb-av { width: 26px; height: 26px; border-radius: 50%; background: var(--cc); border: 2px solid var(--team); display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  .tb-bars { flex: 1; min-width: 0; font-size: 10.5px; }
  .tb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-bar { height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); margin-top: 2px; overflow: hidden; }
  .tb-bar i { display: block; height: 100%; } .tb-bar.hp i { background: #E0554A; } .tb-bar.st i { background: #4A90E0; }
  .tb-nums { font-size: 10px; text-align: right; line-height: 1.2; white-space: nowrap; }
  .tb-nums .ic { font-size: 1.1em; }
  /* 승점 순위표: 오른쪽 위 덱 더미 아래(2026-10-04) — 알림(#toasts)은 그 아래로 내림 */
  /* 2026-10-07: 오른쪽 위 세로 단 #tb-side = 드러난 보급품 → 승점 순위 → 알림 (topbar.js) */
  #tb-side { position: fixed; right: 16px; top: 92px; z-index: 13; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
  #tb-side > .glass { pointer-events: auto; }
  #tb-side #toasts { position: static; }
  .tb-supply { padding: 6px 10px 8px; border-radius: 12px; }
  .tb-supply .tb-rank-h small { font-size: 10px; opacity: .8; }
  .tb-supply-row { display: flex; gap: 6px; }
  .tb-supply-row .card { cursor: zoom-in; }
  .tb-supply-empty { width: 96px; height: 150px; border: 1.5px dashed rgba(255,255,255,.35); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--text-dim); }
  .tb-rank { min-width: 168px; padding: 6px 10px; border-radius: 12px; font-size: 12.5px; }
  .tb-rank-h { font-size: 11.5px; color: var(--text-dim); margin-bottom: 3px; }
  .tb-rank-row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 6px; }
  .tb-rank-row .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .tb-rank-row small { color: var(--text-dim); font-size: 10.5px; }
  .tb-rank-row.first { background: rgba(255,210,122,.18); }
  .tb-rank-row.me b { text-decoration: underline; }
  .tb-rank-n { width: 18px; text-align: center; font-weight: 800; }
  .tb-rank-v { margin-left: auto; font-weight: 800; color: #FFD27A; }
  #tb-piles { flex: none; display: flex; gap: 10px; padding: 4px 12px; align-items: flex-end; }
  .tb-pile { text-align: center; font-size: 10.5px; color: var(--text-dim); }
  .tb-pile b { color: #fff; }
  .tb-stack { position: relative; width: 32px; height: 46px; margin: 0 auto 3px; }
  .tb-stack i { position: absolute; inset: 0; border-radius: 5px; background: repeating-linear-gradient(45deg, var(--pc) 0 5px, color-mix(in srgb, var(--pc) 80%, #000) 5px 10px); border: 1.5px solid rgba(255,255,255,.75); }
  .tb-stack i:nth-child(2) { transform: translate(-2px,-2px); } .tb-stack i:nth-child(3) { transform: translate(-4px,-4px); }
  /* 호버 정보 줄(2026-10-07): 캐릭터 카드 → 적 카드 → 칸 정보를 가로로 따로 — game3d.js showCellTip */
  #hovercards { position: fixed; z-index: 30; pointer-events: none; display: flex; gap: 10px; align-items: flex-start; }
  #hovercards[hidden] { display: none; }
  #hovercards .card { cursor: default; box-shadow: 0 10px 26px rgba(0,0,0,.5); }
  #hovercards #celltip { position: static; }
  #celltip { position: fixed; z-index: 30; pointer-events: none; padding: 6px 10px; border-radius: 10px; background: rgba(20,22,32,.9); color: #fff; font-size: 13.5px; font-weight: 700; line-height: 1.6; box-shadow: 0 6px 18px rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.2); }
  #celltip[hidden] { display: none; }
  #celltip i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  #celltip small { display: block; color: rgba(255,255,255,.65); font-weight: 500; font-size: 11.5px; }
  #celltip { max-width: 340px; }
  #celltip .ct-name { font-size: 15px; font-weight: 800; }
  #celltip .ct-fact { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.82); line-height: 1.45; }
  #celltip .ct-unit { font-size: 12px; font-weight: 600; color: #FFE7B8; line-height: 1.5; }
  #celltip .ct-opts { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,.2); }
  #tools { position: fixed; left: 16px; top: 96px; padding: 5px; display: flex; gap: 4px; z-index: 9; }
  #tools button { font-size: 11px; padding: 4px 8px; }
  /* 칸 찾기(육각 맵): 누른 종류의 칸만 노랗게 — 2026-10-03 사용자 결정 F */
  #finder { position: fixed; left: 16px; top: 134px; padding: 4px 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; z-index: 9; max-width: 560px; }
  #finder .lbl { font-size: 11px; color: #E9E2D2; margin-right: 2px; }
  #finder button { font-size: 11px; padding: 3px 7px; }
  #log { position: fixed; left: 16px; top: 300px; width: 300px; max-height: 150px; overflow: hidden; padding: 6px 10px; font-size: 11px; line-height: 1.45; color: var(--text-dim); }
  #log.hidden-log { display: none; }
  #log .err { color: #FFB0A6; }

  /* 오른쪽 상황판 */
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; max-height: 80vh; padding: 16px; overflow-y: auto; background: var(--glass-strong); font-size: 14px; z-index: 45; }   /* 게임 종료 순위만(F2d) */
  .st-h { font-size: 12px; font-weight: 800; color: #FFD9B0; margin: 2px 0 8px; letter-spacing: .03em; }
  .st-player { padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.06); margin-bottom: 8px; }
  .st-player.cur { outline: 1.5px solid var(--accent); }
  .st-sub { color: var(--text-dim); font-size: 11.5px; margin-top: 3px; }
  .st-missions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }

  /* 배너 · 알림 */
  #banner { position: fixed; left: 50%; top: 104px; transform: translate(-50%, -10px); padding: 10px 24px; font-size: 18px; font-weight: 800; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 30; }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }
  #toasts { position: fixed; right: 16px; top: 236px; display: flex;   /* top은 #tb-side 안으로 들어가면(topbar.js) 무시됨 — 2026-10-07 */ flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none; z-index: 30; }   /* 사건 알림: 오른쪽 위(F2d) */
  .toast { padding: 5px 12px; font-size: 12.5px; border-radius: 10px; background: var(--glass-strong); border: 1px solid var(--glass-line); animation: toastfade 2.6s forwards; }
  @keyframes toastfade { 0% { opacity: 0; transform: translateY(-4px); } 10% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; font-size: 15px; color: #3A3128; z-index: 60; }
  #loading b { font-size: 26px; letter-spacing: 0.5px; }

  /* 시작 화면 */
  /* 시작 창 가운데로(2026-10-17): 예전 오른쪽 상황판(300px) 몫으로 왼쪽에 치우쳐 있던 것 — 상황판은 F2d에 없어짐 */
  #start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 640px; padding: 18px 20px; background: var(--glass-strong); z-index: 20; }
  #start h3 { margin: 10px 0 6px; font-size: 13px; color: #FFD9B0; }
  #start .start-title { margin: 0 0 2px; font-size: 22px; letter-spacing: 0.5px; color: #fff; }
  #start .start-sub { margin: 0 0 10px; font-size: 12.5px; color: var(--text-dim); }
  /* 시작 화면에서는 게임 중 도구(상단 줄 · 도구 · 칸 찾기 · 로그)를 숨긴다(2026-10-17 — 시작 전에 "다시 시작" 등이 떠 있어 어수선) */
  body.at-start #topbar, body.at-start #tools, body.at-start #finder, body.at-start #log { display: none !important; }
  #start .tag { display: inline-block; font-size: 12.5px; padding: 5px 9px; border-radius: 8px; background: rgba(255,255,255,0.1); margin: 3px 4px 3px 0; cursor: pointer; }
  #start .tag.on { background: rgba(232,151,58,0.5); }
  #start select { background: rgba(0,0,0,0.3); color: #fff; border: 1px solid var(--glass-line); border-radius: 8px; padding: 4px 8px; }
  #start select option { color: #222; }
  #start .start-note { font-size: 12.5px; color: var(--text-dim); margin: 8px 0 14px; line-height: 1.5; }
  #start button { margin-right: 8px; }
  /* 이어 하기(2026-10-17): 저장된 판이 있으면 시작 화면 맨 위 */
  #start .start-resume { display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: 6px; border-radius: 10px; background: rgba(232,151,58,0.16); border: 1px solid rgba(232,151,58,0.55); }
  #start .start-resume .sr-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--text-dim); line-height: 1.45; }
  #start .start-resume .sr-text b { color: #FFD9B0; font-size: 14px; }
  #start .start-resume button { margin: 0; flex: none; padding: 8px 18px; font-size: 14px; }
  #start .start-map { margin: 4px 0; font-size: 12.5px; }
  /* 테스트 맵 도구(2026-10-17, ui/sandbox.js): 오른쪽 가운데 */
  #sandbox { position: fixed; right: 16px; top: 300px; width: 300px; max-height: calc(100vh - 420px); overflow-y: auto; padding: 8px 10px; z-index: 13; font-size: 12px; background: var(--glass-strong); border: 1px solid #7FD3FF; border-radius: 12px; }
  #sandbox .sb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; color: #BFE8FF; }
  #sandbox .sb-sec { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--glass-line); }
  #sandbox .sb-h { font-weight: 800; color: #FFD9B0; margin-bottom: 4px; }
  #sandbox .sb-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #sandbox .sb-input, #sandbox .sb-select { width: 100%; box-sizing: border-box; background: rgba(0,0,0,.35); color: #fff; border: 1px solid var(--glass-line); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  #sandbox .sb-select option { color: #222; }
  #sandbox .sb-note { color: var(--text-dim); line-height: 1.4; margin-top: 4px; }
  #sandbox button.mini { font-size: 11.5px; padding: 3px 8px; }
  /* 포트폴리오 데모 빌드(web/build.js demo): 개발용 버튼 숨김 */
  /* 2026-10-18 처음 보는 플레이어 테스트: 로그는 개발용(한글로 안 바꾼 이벤트 · 적 내부 ID가 그대로 보임) → 데모에서 숨김 */
  body.demo-build #btn-tilt, body.demo-build #btn-pause, body.demo-build #btn-build, body.demo-build #btn-log, body.demo-build #log { display: none !important; }

  /* ---------- 핫싯 가리개: 화면을 넘길 때 남의 손패 · 미션이 안 보이게 완전히 가린다 ---------- */
  #passscreen { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: #0c0d12; }
  #passscreen::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--pc, #666) 24%, #0c0d12), #0c0d12 68%); }
  .pass-card { position: relative; text-align: center; max-width: 480px; padding: 0 20px; animation: fadein .25s; }
  .pass-dot { width: 46px; height: 46px; border-radius: 50%; background: var(--pc, #888); margin: 0 auto 18px; box-shadow: 0 0 0 6px rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.5); }
  .pass-who { font-size: 30px; font-weight: 800; margin-bottom: 8px; }
  .pass-msg { font-size: 15px; color: var(--text-dim); line-height: 1.6; margin-bottom: 26px; }
  .pass-card button { font-size: 16px; padding: 12px 28px; }

  /* ---------- 설명서 ---------- */
  #manual { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; }
  #manual .manual-dim { position: absolute; inset: 0; background: rgba(10,8,16,.6); backdrop-filter: blur(2px); }
  .manual-box { position: relative; width: min(1200px, 94vw); height: min(820px, 90vh); background: var(--paper); color: var(--ink); border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; overflow: hidden; }
  .manual-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: #2A2118; color: #fff; flex: none; }
  .manual-head h2 { margin: 0; font-size: 18px; flex: 1; }
  .manual-head button { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }
  .manual-body { flex: 1; display: flex; min-height: 0; }
  .manual-toc { width: 190px; flex: none; overflow-y: auto; padding: 14px 8px; border-right: 1px solid rgba(0,0,0,.1); background: rgba(0,0,0,.03); }
  .manual-toc a { display: block; padding: 6px 10px; border-radius: 8px; font-size: 12.5px; color: #5A4A38; text-decoration: none; cursor: pointer; }
  .manual-toc a:hover { background: rgba(232,151,58,.25); color: #3A3128; font-weight: 700; }
  .manual-content { flex: 1; overflow-y: auto; padding: 20px 28px 60px; scroll-behavior: smooth; }
  .manual-content section { margin-bottom: 34px; }
  .manual-content h3 { font-size: 17px; margin: 0 0 8px; color: #3A3128; border-bottom: 2px solid rgba(0,0,0,.08); padding-bottom: 6px; }
  .manual-content p { margin: 6px 0; line-height: 1.6; font-size: 13.5px; }
  .manual-content ul, .manual-content ol { margin: 6px 0; padding-left: 20px; font-size: 13.5px; line-height: 1.6; }
  .manual-content li { margin: 3px 0; }
  .manual-content figure { margin: 12px 0; }
  .manual-content img { max-width: 100%; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); display: block; }
  .manual-content figcaption { font-size: 11.5px; color: #7A6B58; margin-top: 6px; text-align: center; }
  .manual-content table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0; }
  .manual-content th, .manual-content td { border: 1px solid rgba(0,0,0,.12); padding: 5px 8px; text-align: left; }
  .manual-content th { background: rgba(0,0,0,.05); }
  .manual-swatch { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin: 0 2px; vertical-align: -1px; }
  /* .manual-kbd: 위 kbd와 같은 키캡(2026-10-18) */

  /* ---------- 카드(F2b) ---------- */
  /* 모양 2가지(세로 63×88 · 작은 44×68)를 실물 비율로, 크기는 배율 --k(xs .56 · sm .92 · md 1 · lg 1.26)로만 바꾼다 */
  .card { --k: 1; position: relative; width: calc(168px * var(--k)); height: calc(264px * var(--k)); border-radius: calc(12px * var(--k)); background: var(--paper); color: var(--ink); box-shadow: 0 6px 16px rgba(20, 14, 30, .35), inset 0 0 0 1px rgba(0,0,0,.08); overflow: hidden; flex: none; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, filter .16s; font-size: calc(12.5px * var(--k)); user-select: none; display: flex; flex-direction: column; }
  /* 2026-10-04: 카드 크기 = 실물 표준 비율 — 플레이어 · 시설 70×110(예전 63×88), 작은 카드 56×87(예전 44×68). 글자는 그대로 · 여백을 늘림 */
  .card.shape-small { width: calc(134px * var(--k)); height: calc(208px * var(--k)); font-size: calc(11.5px * var(--k)); }
  .card-xs { --k: .56; cursor: default; }
  .card-mini { --k: .72; cursor: zoom-in; }   /* 드러난 보급품 · 미션 띠(2026-10-13 — xs가 너무 작아서 한 단계 키움, 호버하면 ui/cardzoom.js로 확대) */
  .card-zoom { position: fixed; z-index: 60; pointer-events: none; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
  .card-sm { --k: .92; }  /* 더 줄이면 긴 카드 글이 9px 아래로 내려가 읽기 어려움(129장 검사) */
  .card-lg { --k: 1.26; }
  .card .card-band { flex: none; background: var(--band); color: #fff; padding: .55em 1.9em .45em 2.5em; min-height: 2.5em; font-weight: 800; font-size: 1.05em; line-height: 1.2; }
  .card.shape-small .card-band { padding-left: 2.2em; padding-right: .5em; }
  .card .card-cost { position: absolute; left: .4em; top: .4em; width: 1.8em; height: 1.8em; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1em; color: #fff; border: 2px solid rgba(255,255,255,.85); }
  .card .cost-stamina { background: #3F7FC0; }
  .card .cost-coin { background: #C9962E; }
  .card .cost-vp { background: #8C4AA0; }
  .card .cost-part { background: #7A6048; }
  .card .card-art { flex: none; height: 3.7em; margin: .5em .65em 0; border-radius: .6em; background: linear-gradient(160deg, color-mix(in srgb, var(--band) 30%, #fff), color-mix(in srgb, var(--band) 55%, #F1E8D2)); display: flex; align-items: center; justify-content: center; position: relative; }
  .card.shape-small .card-art { height: 2em; margin: .4em .55em 0; }
  .card .card-glyph { font-size: 2.2em; color: color-mix(in srgb, var(--band) 80%, #000); opacity: .85; }
  .card.shape-small .card-glyph { font-size: 1.4em; }
  /* 전용 카드: 오른쪽 위 삼각 모서리 = 주인 캐릭터 색 · 아이콘 */
  .card .card-owner { position: absolute; right: 0; top: 0; width: 2.9em; height: 2.9em; background: var(--cc); clip-path: polygon(0 0, 100% 0, 100% 100%); display: flex; justify-content: flex-end; padding: .12em .12em; line-height: 1; z-index: 1; }
  .card .card-owner span { width: 1.45em; height: 1.45em; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: .9em; box-shadow: 0 1px 3px rgba(0,0,0,.4); }   /* 아이콘을 흰 원 안에(피드백 3) */
  .card.selected .card-owner { display: none; }
  .card .card-kind { flex: none; margin: .4em .65em 0; font-size: .86em; color: #7A6B58; font-weight: 700; }
  .card .card-desc { flex: 1 1 auto; min-height: 0; overflow: hidden; margin: .3em .65em .25em; line-height: 1.38; }
  .card.shape-small .card-desc { margin: .25em .5em .2em; line-height: 1.32; }
  /* 적 카드 챕터별 수치(Ⅰ · Ⅱ · Ⅲ) — 지금 챕터 칸 강조 */
  .cb-stats { display: flex; justify-content: space-between; gap: 4px; margin: 2px 0 4px; font-size: 12px; }
  .cb-stats span { flex: 1; justify-content: center; display: inline-flex; align-items: center; gap: 2px; background: rgba(255,255,255,.07); border-radius: 6px; padding: 1px 3px; }
  .cb-stats b { font-size: 13px; }
  .act-pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .act-pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #F08A24; background: transparent; }
  .act-pips i.on { background: #F08A24; box-shadow: 0 0 6px rgba(240,138,36,.7); }
  .tier-tbl { border-collapse: collapse; margin-top: .3em; font-size: 1em; width: 100%; }
  .tier-tbl th, .tier-tbl td { text-align: center; padding: 2px 3px; border-bottom: 1px solid rgba(0,0,0,.08); line-height: 1.25; }
  .tier-tbl .now { background: #F5D98A; font-weight: 800; border-radius: 3px; }
  /* 문구 속 아이콘(data/icons.json) · 비용 줄 */
  .ic { display: inline-block; font-size: 1.35em; line-height: 1; vertical-align: -0.2em; margin: 0 1px; }  /* 아이콘: 바탕 없이 크게 */
  .card .card-costs { flex: none; display: flex; gap: 4px; flex-wrap: wrap; margin: 0 .6em .3em; font-size: .88em; font-weight: 700; color: #6A4A20; }
  .card .card-costs span { background: rgba(201,150,46,.2); border-radius: 5px; padding: 1px 5px; }
  .card .card-next { margin-top: 3px; color: #6A5A48; }
  .card .card-flavor { margin-top: 3px; color: #8A7A66; font-style: italic; font-size: .92em; }
  .card .card-stats { flex: none; display: flex; gap: .7em; margin: .35em .65em 0; }
  .card .stat { display: inline-flex; align-items: center; gap: 2px; font-size: 1.05em; }
  .card .stat b { font-size: 1.15em; }
  .card .card-pips { flex: none; display: flex; gap: 3px; margin: .4em .65em 0; }
  .card .card-pips i { width: .9em; height: .9em; border-radius: 50%; border: 1.5px solid #7A6B58; }
  .card .card-pips i.on { background: var(--band); border-color: var(--band); }
  .card .card-footer { flex: none; padding: .3em .65em .35em; font-size: .88em; background: rgba(0,0,0,.06); color: #5A4A38; }
  .card .card-note { order: 2; flex: none; align-self: flex-end; margin: 0 .5em .3em; font-size: .82em; background: var(--band); color: #fff; padding: 1px 6px; border-radius: 6px; }   /* 설명을 덮지 않게 아래 한 줄로 */
  .card .card-footer { order: 3; }
  /* 상태: 못 씀(회색 + 이유 띠) · 선택됨(주황 두꺼운 테두리 + ✔) */
  .card.disabled { filter: grayscale(.8) brightness(.85); cursor: default; }
  /* 못 쓰는 이유 띠: 그림 칸 위에 얹어 설명 글자를 가리지 않게(2026-10-02 테스터 피드백) */
  .card.tagged .card-band { margin-top: 1.5em; }
  .card .card-tag { position: absolute; left: 0; right: 0; top: 0; z-index: 3; text-align: center; font-size: .85em; font-weight: 800; color: #1F2A10; background: #B8E07A; padding: .15em 0; letter-spacing: .05em; }
  .card .card-reason { position: absolute; left: 0; right: 0; top: 13%; text-align: center; font-size: .95em; font-weight: 800; color: #fff; background: rgba(40,30,30,.78); padding: .3em 0; }   /* 22% → 13%(2026-10-17): 종류 줄("암시장 · 방어구")을 덮던 것 → 그림 띠 위로 */
  .card.selected { box-shadow: 0 0 0 4px var(--accent), 0 0 26px rgba(232,151,58,.9); animation: selglowcard 2.2s ease-in-out infinite; }
  /* 선택 표시(✔)는 제목 띠 아래 그림 칸에 얹는다 — 제목 띠에 여백을 주면 제목이 두 줄로 밀려 설명이 잘렸음(2026-10-03 테스터 피드백) */
  .card.selected::after { content: '✔'; position: absolute; right: .35em; top: 2.5em; width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; font-size: 1em; z-index: 2; }
  .card-xs .card-kind, .card-xs .card-footer, .card-xs .card-art { display: none; }
  .card-xs .card-desc { line-height: 1.25; }
  .card-xs .card-note { margin-bottom: .2em; }
  .card-lg .card-footer { position: static; }
  .chooser-count b { color: var(--accent); font-size: 1.15em; }
  .chooser-count small { color: var(--text-dim); font-weight: 500; }
  .card.back { background: repeating-linear-gradient(45deg, #5A4A6A, #5A4A6A 6px, #4E405E 6px, #4E405E 12px); display: flex; align-items: center; justify-content: center; }
  .card-back-mark { font-size: 28px; color: rgba(255,255,255,.5); font-weight: 800; }

  /* ---------- 중앙 선택 창 ---------- */
  .chooser { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; }
  .chooser-dim { position: absolute; inset: 0; background: rgba(18, 14, 28, .55); backdrop-filter: blur(2px); animation: fadein .2s; }
  .chooser-box { position: relative; max-width: 94vw; text-align: center; animation: fadein .2s; }
  /* 2026-10-18 화면 점검: 1366×657에서 카드가 많은 창(손패 초과 버리기 9장)이 두 줄로 늘어나 "버리기" 버튼이 화면 밖으로 밀림 →
     창을 화면 높이 안에 가두고 넘치면 카드 줄만 스크롤(제목 · 버튼은 항상 보임) */
  .chooser:not(.near) .chooser-box { max-height: 98vh; display: flex; flex-direction: column; }
  .chooser:not(.near) .chooser-row { min-height: 0; overflow: auto; justify-content: safe center; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.3) transparent; }   /* 2026-10-18: overflow-x hidden이면 창보다 넓은 줄(드래프트 6열)의 왼쪽이 잘려 닿을 수 없었음 → safe center + 가로 스크롤 */
  /* 카드 도감 */
  .gallery { position: fixed; inset: 0; z-index: 45; }
  .gallery-dim { position: absolute; inset: 0; background: rgba(14,12,22,.7); }
  .gallery-box { position: absolute; inset: 40px 60px; background: rgba(28,30,42,.97); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
  .gallery-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.1); flex-wrap: wrap; }
  .gallery-head h2 { margin: 0; font-size: 18px; }
  .gallery-tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .gallery-tabs button { font-size: 12.5px; padding: 4px 10px; }
  .gallery-tabs button small { opacity: .6; }
  .gallery-body { flex: 1; overflow: auto; padding: 14px 18px 24px; }
  .gallery-group { font-weight: 800; margin: 14px 0 4px; color: #FFD27A; }
  .gallery-row { display: flex; flex-wrap: wrap; gap: 14px; }
  .gallery-item { position: relative; }
  .gallery-item .card { cursor: default; }
  .gallery-n { position: absolute; left: -6px; top: -8px; z-index: 4; background: #FFB020; color: #2A1A00; font-weight: 800; font-size: 12px; border-radius: 10px; padding: 1px 7px; }
  .chooser.near { display: block; }
  .chooser.near .chooser-dim { background: rgba(18,14,28,.25); backdrop-filter: none; }
  .chooser.near.btn-only .chooser-dim { background: transparent; }
  .chooser.near .chooser-box { position: fixed; padding: 12px 14px; border-radius: 14px; background: rgba(24,27,38,.94); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 12px 34px rgba(0,0,0,.5); }
  .chooser.near .chooser-row { padding: 14px 6px 6px; }
  .chooser.near .chooser-title { font-size: 18px; color: #FFF3DC; }
  .chooser.near .chooser-sub { margin: 4px auto 6px; max-width: 420px; }
  .chooser-title { font-size: 22px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .chooser-sub { font-size: 13.5px; color: var(--text-dim); margin: 6px auto 16px; max-width: 760px; line-height: 1.5; }
  .chooser-row .info-card { cursor: default; box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.35); }
  .chooser-sep { align-self: stretch; width: 2px; margin: 0 4px; background: linear-gradient(transparent, rgba(255,255,255,.45), transparent); }
  .chooser-empty { align-self: center; padding: 18px 22px; border: 2px dashed rgba(255,255,255,.3); border-radius: 12px; color: #E9E2D2; font-weight: 700; }
  .card .ci-stats { display: flex; justify-content: space-between; margin: .1em 0 .35em; }
  .card .ci-stat b { margin-left: .15em; font-size: 1.15em; }
  .card .ci-line { line-height: 1.35; }
  .card .ci-perk { margin-top: .35em; padding-top: .3em; border-top: 1px solid rgba(0,0,0,.12); font-size: .92em; line-height: 1.3; }
  .chooser-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; padding: 26px 10px 10px; }
  .chooser-row .card:not(.disabled).hov { transform: translateY(-14px) scale(1.12); z-index: 5; box-shadow: 0 14px 30px rgba(10,6,20,.5); }
  .chooser-row .card.selected { transform: translateY(-18px); }
  .chooser-row .card.selected.hov { transform: translateY(-22px) scale(1.12); }
  .card.deal { animation: deal .38s cubic-bezier(.2,.9,.3,1.2) both; }
  .card.picked { transform: translateY(-120px) scale(1.15) !important; opacity: 0; transition: transform .22s ease-in, opacity .22s ease-in; }
  .chooser-count { font-size: 16px; font-weight: 800; color: #fff; min-height: 22px; margin-top: 6px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .chooser-buttons { display: flex; gap: 8px; justify-content: center; align-items: flex-start; margin-top: 12px; }   /* flex-start: 아래 Space · Enter 안내가 붙은 버튼 옆의 버튼이 같이 늘어나지 않게(2026-10-18) */
  .chooser-buttons button { font-size: 14px; padding: 8px 18px; }
  .chooser.closing { opacity: 0; transition: opacity .18s; }
  .chooser.peek .chooser-dim, .chooser.peek .chooser-box { opacity: 0.08; transition: opacity .15s; pointer-events: none; }
  .chooser.peek { pointer-events: none; }
  .chooser .peek-pill { display: none; }
  .chooser.peek .peek-pill { display: block; position: fixed; left: 50%; top: 100px; transform: translateX(-50%); pointer-events: auto; z-index: 5; font-weight: 800; padding: 8px 16px; background: #E8973A; color: #2A1800; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  @keyframes deal { from { opacity: 0; transform: translateY(90px) rotate(-6deg) scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  /* ? 칸 수색 카드 공개: 뒷면 → 앞면으로 뒤집기 */
  .search-reveal { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; animation: fadein .18s ease; }
  .search-reveal.out { opacity: 0; transition: opacity .2s; }
  .search-reveal .sr-title { background: rgba(20,24,32,.82); color: #fff; padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .search-reveal .sr-hint { color: #fff; font-size: 12px; opacity: .75; text-shadow: 0 1px 2px #000; }
  .search-reveal .sr-flip { position: relative; perspective: 900px; transform-style: preserve-3d; transition: transform .45s ease; }
  .search-reveal .sr-flip > .card { backface-visibility: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .search-reveal .sr-flip > .card:last-child { position: absolute; inset: 0; transform: rotateY(180deg); }
  .search-reveal .sr-flip.open { transform: rotateY(180deg); }

  /* ---------- 아래: 도크 · 행동 바 · 손패 ---------- */
  /* ---------- 왼쪽 아래: 내 자원 줄 + 캐릭터 보드(F2d) ---------- */
  #dock { position: fixed; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  .mission-strip { display: flex; gap: 6px; align-items: flex-end; pointer-events: none; }   /* 내 미션 카드(2026-10-07 오늘 10) — 자원 줄 위 */
  /* 2026-10-17 버그 수정: 미션 카드 줄 상자가 카드보다 훨씬 넓어(도크 너비) 그 아래 보드 칸 클릭을 가로챘다 → 카드만 클릭을 받음 */
  .mission-strip > * { pointer-events: auto; }
  /* 도크 상자 자체(미션 카드 줄 옆 빈 공간 등)도 클릭을 통과시키고, 보이는 판 · 카드만 받음(2026-10-17) */
  #dock { pointer-events: none; }
  #dock > :not(.mission-strip) { pointer-events: auto; }
  .mission-strip.empty { display: none; }
  .mission-strip { transform-origin: left bottom; }   /* 2026-10-18: 도구 줄을 덮을 만큼 위로 밀리면 hud.js fitMissionStrip이 아래 기준으로 줄임 */
  .myres { display: flex; gap: 12px; align-items: center; padding: 6px 12px; font-size: 13px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--glass-line); border-left: 5px solid var(--pc); }
  .myres b { font-size: 14px; margin-left: 1px; }
  .myres .me { font-weight: 800; margin-right: 2px; }
  .myres.cur { --team: var(--pc); background: color-mix(in srgb, var(--pc) 22%, var(--glass-strong)); animation: curglow 1.6s ease-in-out infinite; }
  .myres.cur .me::after { content: ' ▶ 내 차례'; color: #FFD27A; font-size: .85em; }
  .myres .clickable { cursor: pointer; border-radius: 6px; padding: 0 3px; }   /* 연구 카드 보관함 보기(hud.js researchMenu, 2026-10-08) */
  .myres .clickable:hover { background: rgba(255,255,255,.16); }
  .myres .watch { color: #FFD9A0; margin-left: auto; }
  .dock-boards { display: flex; gap: 10px; align-items: stretch; }   /* 두 보드 높이를 맞춘다(피드백 9) */
  .dock-boards:has(.cboard.pick) { margin-top: 20px; }
  /* 세로가 낮은 화면(노트북 브라우저 창 ≈ 1366×657, 2026-10-17 포트폴리오 데모 점검): 왼쪽 아래 도크(미션 카드 + 캐릭터 보드)가
     왼쪽 위 도구 줄까지 올라와 덮던 것 → 도크를 조금 줄이고 "칸 찾기" 줄은 숨긴다(1366×768 전체 화면부터는 그대로) */
  @media (max-height: 760px) { #dock { zoom: .84; } #finder { display: none; } }   /* "눌러서 고르기" 띠가 위 자원 줄을 가리지 않게 한 칸 띄움(2026-10-17) */
  .cboard { width: 218px; padding: 8px 10px; border-radius: 12px; background: var(--glass-strong); border: 2px solid var(--glass-line); cursor: pointer; }   /* 캐릭터 색 위 띠는 선택처럼 보여서 없앰(2026-10-04) — 색은 이름 옆 아이콘 동그라미로 */
  /* 캐릭터 고르기 안내(2026-10-04): 고를 수 있는 캐릭터 보드가 깜빡이며 빛남 + 위에 "눌러서 고르기" */
  /* 2026-10-13 사용자 피드백("하이라이트가 눈에 안 띔"): 굵은 금색 테두리 + 크게 번지는 빛 + 살짝 커졌다 작아짐, 안내 띠도 크게 */
  .cboard.pick { border: 3px solid #FFD27A; animation: pickglow 1s ease-in-out infinite; cursor: pointer; position: relative; }
  .cboard.pick::after { content: '👆 눌러서 고르기'; position: absolute; left: 50%; top: -22px; transform: translateX(-50%); white-space: nowrap; font-size: 15px; font-weight: 900; color: #2A1A00; background: linear-gradient(#FFE29A, #FFC24A); border: 2px solid #fff; border-radius: 10px; padding: 3px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.45); pointer-events: none; z-index: 3; animation: pickbob 1s ease-in-out infinite; }

  /* 배치 때 캐릭터를 아직 안 골랐으면 화면 전체를 어둡게 하고 캐릭터 보드만 밝게(2026-10-13 사용자 피드백) — hud.js pick-char */

  /* 선택 표시 통일(2026-10-04 사용자 피드백): 테두리 하이라이트가 천천히 깜빡임 — 캐릭터 보드 · 고른 카드 공통 */

  @keyframes selglowcard { 0%, 100% { box-shadow: 0 0 0 2px rgba(232,151,58,.5), 0 0 8px rgba(232,151,58,.3); } 50% { box-shadow: 0 0 0 4px var(--accent), 0 0 26px rgba(232,151,58,.9); } }

  .cb-slot.full { border: 2px solid var(--band, #7A6048); background: color-mix(in srgb, var(--band, #7A6048) 35%, #2A2F3A); color: #fff; cursor: zoom-in; }

  .dock-char { padding: 8px 10px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--glass-line); border-left: 5px solid var(--cc, var(--pc)); cursor: pointer; }

  /* ---------- 오른쪽 아래: 행동 버튼(F2d) · 쉘터를 켜면 같이 올라감 ---------- */
  #actions { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center; padding: 7px 10px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-line); z-index: 12; white-space: nowrap; transition: bottom .24s cubic-bezier(.2,.8,.2,1); }   /* 서랍(.drawer-in/out)과 같은 시간 · 곡선 */

  @keyframes endpulse { from { box-shadow: 0 0 0 0 rgba(232,151,58,.9); } to { box-shadow: 0 0 0 6px rgba(232,151,58,0), 0 0 18px rgba(232,151,58,.9); background: rgba(232,151,58,.7); } }
  #actions:not(.center) .act-hint { left: auto; right: 0; transform: none; }
  /* 키보드 키 모양(키캡, 2026-10-18 사용자 요청 "키보드로 누르는 것들 전부 키보드 버튼 모양으로"): 밝은 윗면 + 두꺼운 아래 테두리 = 눌리는 키 */
  kbd, .manual-kbd { display: inline-block; min-width: 1.7em; margin: 0 2px; padding: 2px 6px 1px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 800; line-height: 1.25; color: #2B241C; text-align: center; vertical-align: middle; white-space: nowrap;
    background: linear-gradient(#FFFDF8, #E4DCCE); border: 1px solid #A3967F; border-bottom-width: 3px; border-radius: 5px; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  /* Space · Enter 안내(2026-10-18 사용자 요청 — web/ui/keyhint.js): Space · Enter가 누르는 버튼에 같은 표현으로 */
  /* 위치(2026-10-18 사용자 피드백): 버튼 "안" → 버튼 바로 아래에 테두리 없이. .keywrap = 버튼 + 안내를 세로로 묶은 틀(자리를 차지해 다른 것을 덮지 않음) */

  .keyhint kbd, #actions.crowded .act .keyhint kbd { display: inline-block; margin: 0; animation: keyglow 1.6s ease-in-out infinite; }

  #actions .keywrap { gap: 2px; }

  .prepbox .keywrap { display: flex; width: 100%; }

  @keyframes keyglow { 0%, 100% { box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 0 0 0 rgba(255,210,122,0); } 50% { box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 0 0 3px rgba(255,210,122,.5); } }   /* 키캡 그림자 유지 + 은은한 빛 */
  /* 키가 먹지 않는 순간(창 · 챕터 준비 안내판 · 연출 중)에는 행동 바 배지를 숨김 — 자리는 그대로(버튼 폭이 흔들리지 않게) */
  body.busy #actions .keyhint, body:has(.chooser:not(.closing)) #actions .keyhint, body:has(#prepbox) #actions .keyhint { visibility: hidden; animation: none; }
  #actions button.act { font-size: 13.5px; padding: 7px 12px; }

  #handpickdim { position: fixed; inset: 0; z-index: 40; background: rgba(8,6,16,.45); }

  .hand-pick { position: relative; z-index: 26; width: fit-content; max-width: 100%; margin: 0 auto 6px; padding: 8px 16px 6px; border-radius: 14px; text-align: center; pointer-events: auto; transform: translateY(-72px); }   /* 고른 카드(34px 들림)가 판에 가리지 않게 더 위로 */

  .cardfx { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 54; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; }

  .mt-bag-h b { color: #fff; }
  .mt-pips { display: flex; gap: 3px; margin-left: 4px; }
  .mt-pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); }
  .mt-pips i.on { background: var(--cc, var(--accent)); border-color: #fff; }
  .mt-bagcols { display: flex; gap: 8px; align-items: flex-start; }
  .mt-empty { color: var(--text-dim); font-size: 12.5px; padding: 12px 4px; }
  .mt-cascade { position: relative; width: 134px; flex: none; }
  .mt-cascade .mt-dc { position: absolute; left: 0; }
  .mt-dc { cursor: grab; }
  .mt-dc.fresh .card { box-shadow: 0 0 0 3px #FFD27A, 0 0 18px rgba(255,210,122,.85); animation: selglowcard 2.2s ease-in-out infinite; }
  .mt-dc.lift { z-index: 60 !important; }
  .mt-dc.lift .card { box-shadow: 0 10px 24px rgba(0,0,0,.5), 0 0 0 2px #fff; }
  .mt-store { grid-column: 3; }
  .mt-storez { position: absolute; inset: 40px 12px 10px; display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; }
  .mt-group { flex: none; width: 134px; }
  .mt-bagcols { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
  .mt-sort { margin-left: 10px; }
  .mt-gh { margin: 0 0 6px; font-size: 12.5px; color: #FFD9B0; font-weight: 700; }
  .mt-gh b { color: #fff; margin-left: 2px; }
  .mt-sell { grid-column: 1 / span 2; display: flex; flex-direction: column; background: linear-gradient(rgba(42,48,60,.72), rgba(42,48,60,.72)), repeating-linear-gradient(135deg, rgba(201,150,46,.10) 0 12px, transparent 12px 24px); min-height: 260px; }
  .mt-sellrow { flex: 1; display: flex; align-items: flex-start; padding: 4px 4px 0; overflow: hidden; }
  .mt-sellrow .mt-dc { position: relative; margin-left: -70px; }
  .mt-sellrow .mt-dc:first-child { margin-left: 0; }
  .mt-price { position: absolute; right: -4px; bottom: -6px; background: #3A2E10; color: #FFE27A; border: 2px solid #C9962E; border-radius: 10px; padding: 1px 6px; font-weight: 800; font-size: 13px; z-index: 2; }
  .card .key-strip { display: block; font-weight: 800; font-size: 1.08em; color: #1F2A10; }
  .card .key-strip small { font-weight: 600; font-size: .8em; color: #5A5040; }
  .card .card-staff { flex: none; margin: 0 .65em .3em; padding-top: .25em; border-top: 1px dashed rgba(0,0,0,.18); font-size: .88em; line-height: 1.35; }
  .card .fac-staff { color: #6E665A; } .card .fac-staff.built { color: #2A2018; }
  .card .fac-staff .st-ok { color: #2E7D3E; font-weight: 800; } .card .fac-staff .st-no { color: #B0392C; font-weight: 800; }
  /* 시설 아래에 겹쳐 놓인 생존자 카드: 아래쪽 정보 띠만 보이게(2026-10-07) */
  .mt-faccol { position: relative; }
  .mt-faccol .mt-faccard { position: relative; z-index: 20; }
  .mt-tuck { position: relative; display: flex; flex-direction: column; align-items: center; }
  .mt-tuck .mt-dc { position: relative; margin-top: -156px; }   /* 아래쪽 52px(정보 띠)만 보임, 뒤에 놓인 카드가 아래 층(z-index는 JS) */
  .mt-tuck .mt-dc.lift { z-index: 30 !important; }
  .mt-tuck .card .card-footer { background: #E8F2DC; }
  .mt-sellbar { display: flex; gap: 8px; justify-content: flex-end; }
  .mt-fac { grid-column: 3; }
  .mt-facrow { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .mt-faccol { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px; border-radius: 10px; border: 2px dashed transparent; }
  .mt-staff { display: flex; gap: 4px; min-height: 34px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 140px; }
  .mt-need { color: var(--text-dim); font-size: 11px; text-align: center; }
  .mt-pool { flex: 1; min-width: 140px; align-self: stretch; border: 2px dashed rgba(255,255,255,.2); border-radius: 10px; padding: 6px 10px; }
  .mt-toks { display: flex; gap: 8px; flex-wrap: wrap; }
  .mt-surv { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; border: 2px solid #fff; cursor: grab; }
  .mt-dz { transition: box-shadow .12s, border-color .12s; }
  .dragging .mt-dz.ok { border-color: #4FC08D !important; box-shadow: inset 0 0 0 3px rgba(79,192,141,.85), inset 0 0 40px rgba(79,192,141,.18); }
  .dragging .mt-dz.ok.over { box-shadow: inset 0 0 0 4px #4FC08D, inset 0 0 60px rgba(79,192,141,.4), 0 0 18px rgba(79,192,141,.6); }
  .dragging .mt-dz.no { border-color: #D9534F !important; box-shadow: inset 0 0 0 3px rgba(217,83,79,.8); position: relative; }
  .dragging .mt-dz.no::after { content: attr(data-reason); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 70; background: #7A2320; color: #fff; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; }

  /* ---------- 암시장(F2g) ---------- */
  .bm-box { max-width: 1400px; }
  .bm-dests { display: flex; flex-direction: column; gap: 6px; align-items: center; margin: 4px 0 10px; }
  .bm-dest { display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 5px 10px; border-radius: 10px; background: rgba(255,255,255,.06); }
  .bm-dest .bm-lbl { color: var(--text-dim); margin-left: 8px; }
  .bm-dest button.on { background: rgba(232,151,58,.45); border-color: var(--accent); }
  .bm-row { flex-wrap: wrap; align-items: flex-start; }
  .bm-card { gap: 8px; }
  .bm-badge { font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,.1); }
  .bm-badge.fight { background: rgba(217,83,79,.5); border: 1px solid #FF8A7A; }
  .bm-card .card.selected { transform: translateY(-10px); }

  /* ---------- 정비 · 암시장 판 ---------- */
  #screen { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(18, 14, 28, .42); }
  .screen-box { max-width: 1100px; max-height: 94vh; overflow-y: auto; padding: 18px 22px; border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--glass-line); text-align: center; }
  .screen-title { font-size: 21px; font-weight: 800; }
  .screen-sub { font-size: 13px; color: var(--text-dim); margin: 6px 0 10px; }
  .screen-h { font-size: 13px; font-weight: 800; color: #FFD9B0; margin: 14px 0 6px; text-align: left; }
  .screen-tabs { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .screen-tabs .tag { display: inline-flex; align-items: center; font-size: 12.5px; padding: 5px 10px; border-radius: 8px; background: rgba(255,255,255,.08); }
  .screen-tabs .tag.on { background: rgba(232,151,58,.35); outline: 1.5px solid var(--accent); }
  .screen-tabs .tag.dim { opacity: .5; }
  .screen-row { display: flex; gap: 14px; justify-content: center; }
  .screen-row.wrap { flex-wrap: wrap; align-items: flex-start; }
  .screen-card { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .screen-card .card.hov, .screen-mini-row .card.hov { transform: translateY(-8px) scale(1.06); }
  .screen-col { background: rgba(255,255,255,.05); border-radius: 12px; padding: 8px; }
  .screen-mini-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 40px; }
  .screen-note { font-size: 11.5px; color: var(--text-dim); margin-bottom: 4px; }
  .screen-chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 220px; }
  .screen-chips button { font-size: 12px; padding: 4px 8px; }
  .screen-box > button.big { margin-top: 14px; }
  .screen-box.result .screen-row { align-items: flex-end; padding-top: 16px; }
  .screen-box.result .card-desc { white-space: pre-line; font-size: 1.05em; }
</style>
</head>
<body class="at-start">
<canvas id="c"></canvas>

</div>

  <button id="btn-tilt" class="on">틸트시프트</button>
  <button id="btn-log">로그</button>
  <button id="btn-build" class="hidden" data-tip="장소 건물 모형 보기(끄면 칸 아이콘이 크게)">🏠 건물</button>
  <button id="btn-pause" class="hidden">⏸ AI 멈춤</button>

  <button id="btn-gallery" data-tip="게임에 나오는 모든 카드 보기">🂠 카드 도감</button>

<div id="hand" class="hidden"></div>
<div id="screen" class="hidden"></div>

<div id="passscreen" class="hidden"></div>
<div id="banner" class="glass"></div>
